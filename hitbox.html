<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>当たり判定チェック</title>
  <!-- 開発用のページなので、検索結果に出さない -->
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; padding: 12px; background: #2b3a55; color: #fff; font-family: sans-serif; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .bar { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           padding: 10px; margin: 0 -12px 12px; background: #1e2a40; font-size: 14px; }
    .bar input[type=range] { width: 160px; vertical-align: middle; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
    .card { background: #fff; color: #2b3a55; border-radius: 10px; padding: 8px; }
    .card canvas { display: block; width: 100%; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
    .card p { margin: 6px 2px 0; font-size: 13px; }
    .legend span { display: inline-block; width: 12px; height: 12px; margin: 0 4px 0 10px; vertical-align: middle; }
  </style>
</head>
<body>
  <h1>当たり判定チェック</h1>
  <div class="bar">
    <label>許容誤差 <input type="range" id="tol" min="0.3" max="4" step="0.1"> <b id="tol-val"></b></label>
    <label>頂点の上限 <input type="number" id="maxv" min="10" max="200" style="width:60px"></label>
    <label><input type="checkbox" id="show-img" checked> 画像</label>
    <span class="legend"><span style="background:#e0245e"></span>本当の輪郭<span style="background:#00c853"></span>当たり判定</span>
  </div>
  <div class="grid" id="grid"></div>

  <script src="lib/decomp.min.js"></script>
  <script src="lib/matter.min.js"></script>
  <script src="characters.js"></script>
  <script src="js/shape.js"></script>
  <script src="js/hitbox-check.js"></script>
</body>
</html>
